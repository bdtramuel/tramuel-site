  content: Uhhh. The internal dialogue. So hard to remember that to someone (even a little kid!) you are the world!! Even with stinky hair and sleep deprived! So it may seem very difficult to get through day by day and moment by moment when to us, we just see life and moments passing us by. And you are so right! Honestly we are all just out here trying to make it. So congrats to you, Keep taking moments of time that remind you, you are still an intelligent, opinionated, interesting human being and staying home with little ones is a privilege that not many have. Your work, although not loud and boastful is equally as important.
