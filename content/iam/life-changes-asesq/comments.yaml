  content: "I will try not to go off on a tangent here however, one of the reasons I enjoy personal (written) blogs is because of the realness of the stories.  \nI appreciate you sharing your life-- and experience with us.\n\nYour story reads like you have a great support system in your husband, family and friends. I'm guilty of self-defeat; failure in my career, relationships, or even self-regulation. I believe we are harder on ourselves and struggle with this because of the expectation that others will see us as a disappointment.\n\nWe are not. Continue to recognizing those moments of immense joy and happiness."
