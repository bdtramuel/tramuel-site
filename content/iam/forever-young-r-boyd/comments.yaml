  date: '2014-09-02T01:41:06-04:00'
  content: '"Most of us are at the mercy of our moods and our uncontrollable emotions seem to overflow in most cases. If we are to lead a disciplined Christian life it is much more than controlling our emotional outburst or having the right response for all occasions; it is about having the appropriate expression of our faith."


    So here is where I struggle, I have existential anxiety [fear of extinction], not being able to control my environment and simply coping with it to some successful degree is at times not enough. Sometimes I want to become physical and react violently. [Mike Brown, Eric Garner, Trayvon Martin...] Feeling and thinking that way causes guilt and that guilt has a way of decreasing my faith [in a positive outcome] and how I pray.'
