- id: '1760'
  parent: '0'
  author: Rev. Reginald Boyd Jr
  date: '2014-09-11T22:40:51-04:00'
  content: The expression of Faith must come from our ability to believe that God is in control even when the things around us tell us differently. When we grip our reality and let it take us to an emotional state that does not reflect the God we serve and the Christ who saves then we do not honor God. A question was asked "why do bad things happen to good people?" My answer would be the question why did bad people hang my Jesus on a cross? So that we realize that nothing good can from our will but from God's will. He allows the bad so that we know the truth; he alone can provide, protect, cover, and deliver.
