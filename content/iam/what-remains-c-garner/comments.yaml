  date: '2025-09-11T09:02:40-04:00'
  content: 'Cleo! you and I always ''kept it real.'' That line about turning your ass cheeks only so many times, because I know you, I hear the truth beneath the humor. It’s who you are: sharp, honest, and unafraid to draw the line. This piece feels like sitting across from you again, laughing, talking, sharing life without filter. I’m grateful for the friendship we had and for you sharing what remains.'
