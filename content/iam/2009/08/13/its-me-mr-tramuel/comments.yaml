  content: '"We have an incessant need to make sure things are right {education and career} before we take the next step"

    I can relate to this thought process, and you are NOT alone. Many people think this way (not just men). It''s a need to feel accomplished in areas of your life in order to feel as though you could bring into the relationship strong support and stability, be the backbone (if you will).


    Fortunate for you, there is someone who SEES you for the brilliance that is there and knows your heart is in the right place and will back you up 110%!


    The "Witness" will walk beside you!'
