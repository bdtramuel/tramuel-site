  content: Although we all think that we see things related to this four letter word clearly, I submit that in all likelihood our vision and decision making processes are blurred by the wants. It is so easy to see the points that you make from outside of any said situation, but the reality of it is that there is no correct way of thinking when it comes to LOVE. I think that when it comes to making decisions of the heart the truth is its like knowing your destination without having a clue how to actually get there. Damn I need a life GPS!!! Top notch as usual on the blog! (By the way I agree with you on Robinne Lee!)
