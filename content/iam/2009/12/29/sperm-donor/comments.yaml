  date: '2010-01-04T13:10:41-05:00'
  content: 'Having read Brian''s blog on sperm donor, I contemplated writing a comment. The question of concern was If I did comment would I be invading his space, or If I were to reply, would I be able to give a fair perspective. I opted to write. So, here goes. Your biological father, and I say that only for inference, and from here on will be refered to as sperm donor, missed a great opportunity to meet a most unique individual. Let me say first that I am so proud of the man you have become, so very proud to say you are my son. Don''t waste time and energy on being angry with the sperm donor, I am not, it is because of him that we have each other. It is certainly his loss that he did not bother to know you or to see how our relationship bonded in spite of his neglet and caring. Were you a mistake ? NEVER, the mistake was with me for having made wrong decision in my life. But know that I will never regret the decision to keep you as a part of my life. For me there were no other options,
    or alternatives, I did not need or want any. Was it unfair to you not to force a relationship with the sperm donor, or was it my selfishness. Selfish to the point of saying I don''t care , , , and for some odd reason I really didn''t. There were times when I thought, I should take him to see the sperm donor, but I thought, he knows where he lives, he knows he exists. Again was it my selfishness. I can''t make an apology for that because I felt that that was a good decision on my part at the time. To have to force a relationship would have been in my opinion, unfair to you and unfair to me ( selfish ? )Why would we have to grovel, please, who needed that ?? Did I cause you unnecessary pain, grief, sadness, unhappiness ? If so, then for that I am so very sorry, but know that you could not have been loved any more than if the sperm donor had been part of your life. Now, there is a lot to be said for children growing up without a father figure or a male influence in their lives. There has
    been a lot of pyschological rhetoric and commentary on the adverse and negative affects of not growing up with a male influence, but it''s not always the case. My nephew grew up never knowing his sperm donor nad he retired from the military full service, with honors, by the way he was only 40, my neice grew up without a male influence, she is a business woman and a highly motivated and driven individual, a few household names, Bill Cosby, Warick Dun of the Atl Falcons, Mike Phelps, Olympic Gold Metalist, Ed Bradley, co-editor of CBS 60 Minutes, all from single parent households, and what about Mr. Obama ??Before I end, I think back of the few people that were allowed to interface with Brian ( his choice ) and remember two young boys, both from households having both mother and father present, they are and have been for the biggest part of their lives, in prison, serving time for murder.

    Would your character, your nature, your personality, your soul be any different if your name was anything other than "Mr. Tramuel"? You were uniquely and divinely designed as YOU and there is not another individual exactly as you are. (Dorian may come very close, but not even she is an exact duplicate) :>) Always remember, you define who you are, not a sperm donor , , , , , ,'
