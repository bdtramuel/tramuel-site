  date: '2010-01-19T03:14:39-05:00'
  content: 'Wow Nona, can I just say that your response to this post made my heart smile!!!!

    I''ll throw my two cents in by introducing myself as an adopted child who has never met my biological mother nor father. I was adopted by a young couple who really had no business bringing a child into their dysfunctional world. I still have vivid, memory scars of my "father" beating my mother, holding a knife to her throat and the list goes on. Thank God she had the family support she needed and the courage to leave him. This man who chose to be my father did not deserve that title, and I''ll admit, I yearned for it. He was in and out of my life every 3 years or so and never cared about how much my mother struggled to provide for me and how I did without. He would build in my eyes an image of a great man (all lies) and attempt to fill the void of absence in my life with broken promises.


    It was very hard growing up with a mother who took care of my physical needs but not an ounce of my emotional needs; there was a level of resentment on her part for adopting a child that she was now left to raise on her own.


    Did this somehow have an affect on my inability to trust men, to expect to be disappointed by them? Did my mother''s areas of neglect leave me with a level of self esteem that makes me at times unsure of myself? ......perhaps.....


    I have a son who is now 21, and I made the same choices as Nona, to NOT force his father on him. He knew where he was, he knew where he lived, was never denied contact had he chosen to....


    I told my son the exact same thing...."you have grown into a wonderful man and HE missed out on so many wonderful opportunities to share in the wonderful person he created". Looking back I know I made the right choice because the sperm donor''s life has been down a pathway of so much negativity, that my son did not need to be a witness to all of those ups and downs that I myself had been exposed to as a child.


    Ultimately all of our choices in life are up to us and we''ve all been dealt a different hand from the deck of cards we call "life". In a perfect world we would live like the "Cleavers". Instead because of all the imperfections, I believe it''s seasoned us to be the beautiful, strong, intelligent and at times dysfunctional people that we are!'
