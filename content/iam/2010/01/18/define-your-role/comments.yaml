  date: '2010-01-18T16:50:54-05:00'
  content: 'I do agree that a decision always needs to be made and that someone eventually gets their way. I believe the compromise is usually when one person bows out and allows the other person to have their way...in return for being able to have their way the next time a disagreement arises.

    For some people this works...and for others it is a complete disaster. Simply put some people always want to have their way...and that is when there is really going to be problems in the relationship.


    Good post.'
- id: '120'
  parent: '0'
  author: Mich611
  date: '2010-01-19T03:48:06-05:00'
  content: 'I agree JSin, if one person gets their way, the other person should either one of two things:

    1) "have their way the next time a disagreement arises"


    2) get some type of consolation prize. This of course would depend on the topic of disagreement or level of severity ;o)


    Whatever the case may be....the winner of the disagreement (hardly ever can we call it a compromise) should not be the winner every single time. That''s the level of empowerment and control that leaves other said person constantly feeling empty and neglected.


    >>talking from experience of past bad marriage<<

    (and NO I was not the winner)'
