  content: 'I have always had a soft spot for the homeless but lately they are becoming too demanding. I always give unless I don''t have it. My teacher taught us to just go buy them the food instead of giving them the money. She said she had one homeless man that wanted money and she offered him food and he declined and as she was leaving he knocked on her window and said he would take the food. So I understand what the lady in the store probably was saying but the Word Interpretations???? CHILE BOOM!

