  content: 'I used to say I wouldn''t date a man with kids unless the mother had passed away. I know...but I didn''t want to deal with what so many of my friends had to deal with. But the older I got, the chances of finding a decent, monogamous, respectful, hetero, "good for me" man, who didn''t already have kids became really really slim and I had to open my mind to being a step mother. I''m glad I did, because in my case it worked out...for \*\*us\*\*. Unfortunately the ex (who did the leaving, I might add) seems to feel some how slighted aka pissed that life goes on without Her Stankness. But it does go on, even if \*\*we\*\* have to way too often deal with her nonsense. Taking a cue:Our arguement: Why do we only get the child for 2 hours a month when you want to go out with your friends?

