  content: 'So, Webster says success is a: degree or measure of succeeding b: favorable or desired outcome; also : the attainment of wealth, favor, or eminence. I say Webster needs to hush!!

    I want to learn to do the Salsa, Merengue, Waltz, the FoxTrot...

    I want to learn to play the piano so that I can not only love to HEAR Clair De Lune, but to fall in love with it all over again as I FEEL the passion of it...

    I want to take Karate lessons...

    I want to get that degree I keep postponing because working to survive is taking up too much of my time...(I''ve been told I''m using that as an excuse)

    Oh yeah, and where''s that dream house with my island sink and breakfast bar, that sits just off from the family room??


    Of these things, I have none....does that mean I''m not a success?


    Hmmm Success....

    There are those who "look" like what society says success is suppose to look like, but behind closed doors, are they really?


    Mr. Tramuel that inner critic of yours is your drive that''s going to keep you walking tall, keep pushing you, keep motivating you...


    Each time that Brilliant daughter of yours shows you those college A''s, that''s success.

    Each time you step up to the plate to accept the challenges of your teenage "man" and can look back to see results, that''s success.

    When your mini-me looks up to and shines that big snaggle-tooth smile at you and it makes your heart smile, that''s success.


    Being able to look at yourself and admit your faults, then take the steps to correct them and learn from them; meanwhile displaying love to the ones you care about and remembering to show yourself love...to me that speaks "success".


    Remember when Momma used to say..."They''re gonna talk about you whether it''s good or bad"? This is truth! Continue to do you!!'
