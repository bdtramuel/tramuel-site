  content: '“Ever wish you could (re)wind time and do something a little different?”

    Of course, who doesn''t, but i also feel everything i have done, every mistake, wrong path i have taken have been on purpose, purposeful for me to be who i am today. I would have not learned those lessons early had i been lavished with everything my heart desired without any repercussions, or setbacks. My strength lies in my failures, mishaps, pain...my success and true joy lies in what i''ve learned from it all.


    Self-sacrifice


    I would have been more aware of sacrificing my personal interest, things that I love for the supposed benefit of others.


    That above speaks volumes to me...i know now that it''s never too late for me to indulge again in my dreams though, so even though i didn''t follow through before...i''ve got a second chance :)'
