  content: 'Neighbors: It could be that they didn''t want to dirty your floor and I realize \*\*you\*\* were walking on it but it''s \*\*your\*\* floor. OR I have heard of superstitions regarding entry into dwellings, like, entering for the first time from any door but the front door is supposed to bring bad luck.

    Broom: The only "explanation" I have heard on this one is that to bring an old broom into a new place is to bring old problems into a new place. I think it dates back to when a broom was all a person needed to keep the floors clean because I suppose now the same thought could apply to vacuum cleaners. In any case, I have never brought my old broom with me when I moved. Not so much because of the superstition but usually because a final sweep was the last thing I did in the old place and there was no room for the broom in my car. Hmmm but I did bring my swiffer to the GA move and that was the worst move I ever made.....hmmmmm.


