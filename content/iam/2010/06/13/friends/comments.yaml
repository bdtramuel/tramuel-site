  content: 'great peace (misuse intended) Mr. TramueL. Like you mentioned I used to call coworkers friends. We''d hang out, talk on the phone, and all the "stuff" friends do.

    Funny thing is...after they or I moved on to another job...the communication dwindled from occasional to none at all.


