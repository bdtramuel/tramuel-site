  content: In "Investigative Interviewing" (A class I took for H.R) one of the basics is...never ask "Why". Why is the only question that is speculative and subjective where as who, what, when are to find facts. Having said that, the implied message there is that \*\*why\*\* results in \*\*lie\*\* so don't even \*\*try\*\* because it's a waste of \*\*time\*\* (stretching my poetic arms but you get me.) Unfortunately, we as humans are compelled to find out the why's in this world. We need reason to make everything make sense. The problem is, some things just don't make sense. I recently wasted a good number of hours on Why when I already had the who, what, and even the when. I should have stopped there.Awesome post, as always.
