  content: I wholeheartedly feel you on this post my brother. Social media connects you to people and things and that's what great about it but that's also what's bad about it. I find myself connecting to people I could give two less of a craps about. I have a FB but I have nine friends & I barely manage it. I thought about using it more but I only want to do that for more blog hits. And since I blog under a different name it defeats the whole purpose b/c I use LoudPen as a branding tool & to hide my real identity. Today I came to the conclusion to use all sites I can to grow my audience but only the ones I like which are Twitter, LinkedIn, YouTube, email marketing, and commenting on blogs. FB can kick rocks, I just don't want to be bothered.
