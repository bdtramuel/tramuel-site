  content: 'I hear you. Facebook has contributed to 2 divorces that I personally know of, not to mention causing a lot of drama and hurt feelings. However, it has also been good for some things but there does come a time when you might need to consider that \*\*maybe\*\* it has outlived it''s usefulness. Same as you, in the beginning I accepted every friend request. I am now "friends" with people I haven''t seen since grade school and have no way of knowing if these are people I still would like if I ever saw them again in person. Through FB I have gotten to know people I never would have, gotten apologies from ex''s and reconnected with family to some extent. There are 2 very important relationships that I have now that I would not have for sure if not for FB (yes, Sir...you are one). But, after also having drama:The girlfriend of someone I only knew because of Mafia Wars sent me an angry email because he kept poking me.

    Ex''s trying to pretend we once had something real and wanting to inbox about it all the darn time.

    Women trying to get at my guy.

    Just stupid stuff to add to the stupid stuff that happens already in day to day life.

    I am also thinking of, maybe not leaving FB, but going dormant for a while. I still get to share in things that I would miss (Births, deaths, marriages, etc) but I don''t need to be sooooo connected to it as I am.'
