  content: At times, well at most times, i tend to be the most indecisive person in the world. The only time i can truly make a decision w/out doubt or the feeling of regret is when it comes to my loved ones, that's when Superwoman steps in, cape an all. I appreciate your honesty and dealings w/being indecisive. I always think it is brave when people can acknowledge what they believe to be their faults and yet continue to improve on them. I don't really rely on too many...let me restate that, i don't let my fam know when i'm in trouble, i think mainly bc they see me as Superwoman, even when i just want to be Kate Klent at times, so it's hard to come to them. I have a few friends and my blog for that. I share more on my blog, then i have ever shared w/my fam. I know, i know, not always a great thing, but as soon as i can get rid of this cape, things may be better for all of us. Sorry for writing a dissertation on your blog, lol, but i enjoyed the post.
