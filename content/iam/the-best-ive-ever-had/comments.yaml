  content: At times my life (and personality) can be rather pretentious and extremely discerning, but growing up in upstate NY, nothing can make put all of that aside and make me slow down like a drive in the country or a hike along a lake (I'm a country girl at heart). The best I've ever had? It's a tie. But unsurprisingly, they both take place in upstate NY. A local pizzareia prepares a breakfast pizza, which travels surprisingly well. What's more perfect than a morning hike that ends right as the sun rises, enjoying pizza for breakfast? And a pizza meant to be eaten for breakfast at that! The second, you'd have to see it to believe it, but there are still drive-ins located in upstate NY. A movie you've seen hundreds of times before plus great pizza (thin crust arugula caramelized onions and prosciutto is my favorite but the drive in calls for the standard pepperoni) , beer, plenty of napkins, and a car full of friends; it doesn't get much better than this.
