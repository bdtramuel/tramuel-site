  content: 'Very reflective submission on behalf of C. Garner.


    I''ve never visited Chicago (only passed thru a few times on my way to Milwaukee) for any significant time, but I will never understand why there''s so much violence in the city. I mean, Chicago had always been known for its violence as long as I can remember. But I can''t recall it ever being at a point where it currently exists. While the life of each person killed is tragic, I remember reading about the death of Hadiya Pendleton and it still bothers me to the day.'
