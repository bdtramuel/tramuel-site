  content: 'You had me at Ted Lasso 🫶🏽


    Thank you for posting this, you were in my head, I swear!!


    I have experienced a person in my life, that for many years I called my sister. I have been there for many monumental and transitioning moments for her. She has witnessed moments for me, but has not “been there”. The last straw has been her lack of support after DJ’s passing. I remind myself of the scripture from Ecclesiastes 3:1-8 to help me slowly release her and remember that it was a season and now I have to move on. The human part of me is very wounded by this loss. I’ve viewed it as another death. A little overboard for some perhaps, but to me major at this part of my journey. “Family” has not been as supportive as I’d wished them to be. Anger has been at the forefront, forcing me to “show them” how they’ve angered me or hurt me. #Revenge


    Thank you for the reminder to check myself and my emotions. Protecting my heart and my soul. #Peace'
