  content: This post is an affirmation. As I navigate through the transition of relationships with friendship being high on the list, I realize "we are/were friends for a reason." However, those reasons may have served both parties in specific areas that now no long hold a space, and that's okay! Although I pride myself on meeting people where they are, and thankfully this is reciprocated, I understand change. Some friends aren't equally yoked and their paths are not headed in the same direction, and that's okay! I see these "ships" sinking, moving towards the horizon, and some even out of view. I've learned the art of accepting seasons and reasons. I exit peacefully, and that's okay!
