  content: "I never thought about comparing both \"S\" words...and now my brain is teeming with other comparisons, after you've highlighted a couple in a clever and succinct manner.  \nI think Point One and Point Four are very closely related- you can be assaulted and there's no limit to the effects-- which can be connected to ADDICTION. Sugar comes in many forms and so even our favorite \"guilty pleasure\" that's NOT candy can be very bad health-wise. With sex- the possible dark side can be brought on by other people or ourselves (i.e., addictions to sex.)  \nI try to celebrate sex as much as possible as an adult after growing up with family that was either silent or just outright condemning it. But I do want to point out that another alternative to sex is non-sex (abstinence or celibacy), which I suppose is the safer alternative."
