  content: Loved the post. Something to consider. I have recently started using the term "spending plan' vice budget. For many, 'budget' has many negative connotations, representing constraints and speaks to what you will not, or cannot do. Conversely, a spending plan, formulated by both participants in a relationship, speaks to what common values and goals you have; and how money should flow in and out of the home.
