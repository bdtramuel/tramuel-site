  content: It occured to me just recently that in the past when I thought I was in love \*\*with\*\* someone, my comments were more about how "he made me feel" and not about the man himself. "He makes me feel special." Eventually, it would come to my attention that after some time, I would feel more special when I wasn't in the same guy's presence. How I knew my current love will also be my last, and really, my only is that my comments are about him.."he's a stand up guy." " He's good to me." ..It's not how I think he makes me feel...it's how I feel with him, around him, about him. That for the first time I really understand the imperfection of a union as a natural and necessary thing. And it's....good like that!
