  date: '2011-08-27T15:24:43-04:00'
  content: 'I just feel like some of us are forgetting why we started to blog. Some of us feel pressured to always post something or we''re so busy trying to blow up that we can''t find time to respond to our readers. I think if a reader takes time to read and time to say something, it''s only right to give them enough of your time for a response.

    Personally I appreciate those who take the time to read and give me feedback. It means a lot and I''ve dealt with some situations based off the knowledge and advice I''ve gotten from comments, so I know the value of people and being personable.'
