  content: I somewhat agree. Anytime a blogger has to "feel bad" for venting or being too personal (I just saw those comments in two people's postings recently), then there's definitely been a change in the expectations of bloggers (or maybe just of themselves)! When I started blogging (and I think this is true for most of us) I did it for PERSONAL reasons and reflections! Now some unseen force has us to believe that we blog for the public's benefit and the "greater good"! Well, I feel that force is WRONG! ... To a point! Although we should be cognizant of our readers and yes SOME of us have to do our "greater good" and social commentary blog posts! But for the most part we should all be able to remain personal in our posts! These blogs belong to us! With a few exceptions, we don't belong to or report to any news agencies so why must we lose our ability to be personal! Our blogs are our creations to be molded in our own "emotional" image! Not directed by the general public's insecurities
    and shortcomings! If they can relate to our shortcomings & insecurities, they can realize they share a bond with the blogger! If they can't relate or want the news...then let them go to cnn.com!
