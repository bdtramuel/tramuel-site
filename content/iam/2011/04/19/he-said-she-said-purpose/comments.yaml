  content: Yes. This has been part of my transformation over the past three years. I stopped one day and asked myself what it is I should be doing. My *purpose* was to be successful & by successful I mean make some money & by make some money I mean *thinking* I was impressing all of you. I understand that I am absolutely unique, just like everyone else. *“What you do is not who you are”* from Grace Walk by Steve McVey. Halle Berry is an actress, the future mother of my unborn children & fine as all get out but acting is what she does, it is not who she is. Point is to not get too caught up with the world & things. I feel something pushing, calling & I’m trying to get silent enough to hear the voice that’s calling.
