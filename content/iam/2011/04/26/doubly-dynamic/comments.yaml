  date: '2011-04-26T13:12:40-04:00'
  content: 'I needed this..these...all of it. I am one who, as soon as I start to accept any bit of happiness, even for a moment, will let past mis-steps, mis-stakes, mis-haps, and whatever other mis-ses creep in and remind me of what a horrible and oh so human person I am capable of being, and therefore do not deserve the bits of happiness I am able to capture. I need to work on letting the past be the passed.

    And about faith...I admit...I struggle. But when I stop and think, and count my blessings, I do see that God does, and has come through for me, time and time again. So why do I find myself questioning at times if he \*\*will\*\* come through again? Because, I suppose, I have not always been able to see God''s Graces for what they are and mistakenly thought that He didn''t answer my prayers. I have to remember that even though I pray for a call from God, he may decide that a text or email is better for Him...but He will respond.'
