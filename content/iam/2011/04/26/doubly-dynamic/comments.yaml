  date: '2011-04-27T01:03:54-04:00'
  content: 'I wrote "Sometimes *we* don''t believe ..." but it was really a note to myself. I''m guilty of injustice collecting. Conversations, observations, textersations & Blog Post by others provided the light for me to see. After typing & deleting a comment fifty times for [When marriage Is Off The Table](http://sunnydelyte21.wordpress.com/2011/04/25/when-marriage-is-off-the-table%E2%80%A6/) via SunnyD, I realized the power of speaking a thing into existence. After my divorce I''ve constantly repeated that I will never get re:married but I know Halle Berry, that little black baby & I will be united one day. Positive confession. We & by we I mean you & I, have to keep that inner critic at bay and stop the negative self-talk. Let us be great!

    RE: Faith More negative self-talk. It is about not believing I''m worthy of HIS consideration. I normally only pray for others & never for myself, the power in this woman''s voice was powerFULL & powerFILLED ... my take away; No matter what a mans past may have been, his future is spotless.


    I appreciate you.'
