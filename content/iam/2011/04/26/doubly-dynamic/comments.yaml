  content: So true and good thoughts to ponder. I'm sure i'm as guilty as most of this so-called, "self-incrimination"...but like you i try to move past it. Funny thing on FAITH...i was sharing a story with my mother and fam how i thought that getting baptized was the cure to all my ills...in total i've been baptized 6 times....go figure. We laughed really good about that, but what i've come to realize that your faith as well as your existence really lies within you and your relationship to God...didn't know that before, thought the waters would heal me...but i know now, and so my walk is so much better for it!
