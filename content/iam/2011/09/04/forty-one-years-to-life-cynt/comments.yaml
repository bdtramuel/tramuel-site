  content: 'I''m always uncomfortable talking about death. I have morbid thoughts while driving; envisioning an accident, hospital visits & subsequently my death. That thought process is two-fold as it sparks awareness; awareness of my surroundings, I''m always scanning, searching for an out ... if that truck pulls out in front of me, if this car switches lanes ... being proactive instead of reactive.

    *"The older I get, the more I realize that there will come a point where I… we.. will age no more. But we can still live on."*


    This speaks volumes. & bare with me as my thoughts are all over the place with this! I don''t want it to turn into a mini post. Lol. I''ll share a short story & then I''m out.


    My family never said "I love you" it took a series of deaths to get us to understand the *happiness/pain/love/loss/success/failure…this…life that we all have is to be shared with each other* ... now we never miss an opportunity to say it. Much love to you Cynt.'
