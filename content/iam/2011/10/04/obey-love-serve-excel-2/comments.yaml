- id: '1343'
  parent: '1332'
  author: Mr.TramueL
  date: '2011-10-08T05:57:05-04:00'
  content: 'It''s a process, the first step is that we are conscious of it. In general I''ve started saying yes more slowly. Most of us have a knee-jerk reaction when someone ask us to do something. So when I say slow down, do that. Think about what you are saying yes to. Recent real life example ... a girlfriend asked me to help her move. It was on a weekend I knew I would have my kids & always wanting to be the come through guy I almost gave a solid yes before she could finish the question. I caught myself & started asking questions ... How many others? How far? Will you have already packed or you need help with packing too? Have you already reserved a truck? ... her responses gave me the insight to graciously decline. Give more thought to what you are saying yes to.

    Thanks for coming through ~'
