  content: 'As a parent, it seems that we focus on providing for our children''s material needs, material in the sense of shelter, clothing, food… In the sense of making a living sometimes we forget to live. That lack of focus, at times causes us to miss out on providing for their emotional needs.


    In preparing this project I''ve had more than 4 discussions, including the tweetversation with you concerning parents finding the time to focus on kids, maybe one of the greatest challenges of parenting.


    Powerful lesson of forgiveness. Thank you for sharing.'
