  content: '[...] I’m in love with silence. There are times when the sounds I love; music, my kids laughter, her voice … are too much for my ears. I Am not unhappy at those times however, with my will directed inwards I seek paths that allow me to get away from everyday “noise” at least some of the time. When I speak of noise I mean chaos, disorder and at times actual auditory noise. This is especially heightened now that my hearing has improved. [...]'
