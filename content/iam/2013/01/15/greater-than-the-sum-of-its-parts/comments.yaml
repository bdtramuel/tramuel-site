  content: Thanks for sharing this information. Many people never get to meet someone (outside of maybe their grandparents) who has hearing loss and is affected in all different aspects of life. Quality of life is of upmost importance, especially in the life stage where you rely heavily on your hearing to make that bread! I find that most people with hearing loss don't disclose to people they barely know unless it's TRULY necessary...so I just want to thank you for sharing your story because that means you trust this space and the people you connect with through this medium.
